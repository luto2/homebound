<!-- @dsCard group="Navigation" height=470 width=1040 subtitle="Toolbar map switcher, its menu and the Delete map submenu, plus the map tag on the canvas" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><style>
.frame { width: 1000px; border: 1px solid var(--line-1); border-radius: var(--radius-3); overflow: hidden; }
.title { height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-muted); background: var(--bg-0); border-bottom: 1px solid var(--line-1); }
.tb { height: var(--size-toolbar); display: flex; align-items: center; gap: var(--sp-12); padding: 0 var(--sp-12); border-bottom: 1px solid var(--line-1); background: var(--bg-1); }
.tb .mark { font-weight: 800; letter-spacing: .14em; font-size: 11px; display: flex; align-items: center; gap: 6px; }
.tb .sep { width: 1px; height: 20px; background: var(--line-1); }
.mapbtn { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--accent); background: var(--accent-dim); border-radius: var(--radius-2); font-weight: 600; }
.mapbtn .g { color: var(--accent); } .mapbtn::after { content: "▾"; color: var(--ink-muted); margin-left: 2px; }
.cv { height: 360px; position: relative; background-color: var(--bg-0);
  background-image: linear-gradient(var(--line-1) 1px, transparent 1px), linear-gradient(90deg, var(--line-1) 1px, transparent 1px), linear-gradient(var(--grid-dot) 1px, transparent 1px), linear-gradient(90deg, var(--grid-dot) 1px, transparent 1px);
  background-size: 62px 62px, 62px 62px, 20.667px 20.667px, 20.667px 20.667px; }
.maptag { position: absolute; right: 12px; top: 10px; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-1); background: var(--bg-1); border: 1px solid var(--line-1);
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.maptag b { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 12px; }
.pos { position: absolute; }
.lm-menu.map { width: 300px; }
.lm-menu.del { width: 200px; }
</style></head>
<body>
<div class="frame">
 <div class="title">Homebound · Corp</div>
 <div class="tb">
  <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="4" cy="11" r="2.4" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="12" cy="5" r="2.4" fill="var(--accent)"/><path d="M5.8 9.3l4.4-2.6" stroke="var(--ink-muted)" stroke-width="1.5"/></svg>HOMEBOUND</span>
  <span class="sep"></span>
  <span class="mapbtn"><span class="g">▦</span>Corp</span>
  <span class="lm-input combo" style="width:178px;height:24px">⌂&nbsp;<b>Home</b>&nbsp;<span class="lm-mono lm-muted" style="font-size:12px">J120617</span></span>
  <span class="lm-input combo" style="width:160px;height:24px;font-size:12px">Letters + digits</span>
 </div>
 <div class="cv">
  <div class="maptag">Map <b>Corp</b></div>
  <div class="pos" style="left:150px;top:4px" id="m"></div>
  <div class="pos" style="left:449px;top:162px" id="d"></div>
 </div>
</div>
<script>
function it(c, cls, inner) { return '<div class="it ' + (cls || '') + '"><span class="ck">' + (c || '') + '</span>' + inner + '</div>'; }
var maps = [['Main', 'J161940', '12 sys · now'], ['Corp', 'J120617', '23 sys · 4d'], ['Scratch', 'no home', '0 sys']];
var m = '<div class="lm-menu map"><div class="sec">Maps</div>' + maps.map(function (x) {
  return it(x[0] === 'Corp' ? '●' : '', '', '<b class="nm">' + x[0] + '</b><span class="lm-mono lm-faint" style="font-size:12px">' + x[1] + '</span><span class="meta">' + x[2] + '</span>');
}).join('') + '<div class="sep"></div>' + it('', '', 'New map …') + it('', '', 'Rename “Corp” …') + it('', 'is-hover', 'Delete map<span class="sub">▸</span>') + '</div>';
document.getElementById('m').innerHTML = m;
document.getElementById('d').innerHTML = '<div class="lm-menu del">' + it('<span style="color:var(--danger);font-weight:800">✕</span>', '', 'Main') + it('<span style="color:var(--danger);font-weight:800">✕</span>', '', 'Scratch') +
  '<div class="sep"></div><div class="it is-disabled"><span class="ck"></span>Corp is open: switch first</div></div>';
</script>
</body>
</html>
