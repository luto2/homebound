<!-- @dsCard group="Data" height=450 width=640 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><style>
.lm-table .nm { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
.lm-table .nm .tg { color: var(--ink-muted); }
.lm-table tr.gh td .cnt { margin-right: 2px; }
.note { position: absolute; font-size: 11px; color: var(--accent); white-space: nowrap; }
</style></head>
<body>
<div style="width:600px">
<div class="lm-row" style="margin-bottom:8px"><span style="font-size:15px;font-weight:600">Signatures</span><span class="lm-faint" style="font-size:12px">9 sigs · 4 anoms · last paste 2m ago</span><span style="margin-left:auto" class="lm-row"><button class="lm-btn primary sm">Paste sigs <span class="lm-kbd">Ctrl+V</span></button></span></div>
<div class="lm-banner warn" style="margin-bottom:8px"><span class="g">▲</span><span><b>2 sigs missing</b> from the last paste <span class="lm-faint">· anomalies untouched</span></span><span class="end"><button class="lm-btn sm">Keep</button><button class="lm-btn danger sm">✕ Delete 2</button></span></div>
<table class="lm-table" id="t"></table></div>
<script>
var LM = window.Homebound;
/* ['h', key, bullet, title, count, open, missing, new] for a header · [flag, sig, type, name, scan, age, bookmark, rowclass] for a row */
var R = [
 ['h', 'sig:wormhole', 'wh', 'Wormholes', 4, 1, 0, 1],
 ['', 'ABC-123', 'B274', '→ 8 Jita', 100, '1h 12m', '123-1'],
 ['', 'KLV-554', 'K162', '→ C3 · M · ◷ &lt;1h · R', 100, '2h 40m', '123-2', 'is-selected'],
 ['', 'QRT-801', 'O477', '→ A', 100, '34m', '123-3', 'is-hover'],
 ['+', 'MMX-310', '?', '', 38, '1m', '', 'is-new'],
 ['h', 'sig:data', 'data', 'Data', 2, 0],
 ['h', 'sig:relic', 'relic', 'Relic', 2, 1, 1],
 ['', 'NBV-447', '', 'Forgotten Frontier Recursive Depot', 100, '5h 03m', ''],
 ['−', 'PLW-662', '', 'Forgotten Frontier Quarantine Outpost', 100, '9h 15m', '', 'is-missing'],
 ['h', 'sig:unknown', 'unknown', 'Unscanned', 1, 1, 1],
 ['−', 'UTE-071', '', '', 12, '1d 2h', '', 'is-missing'],
 ['h', 'anom:combat', 'combat', 'Combat', 3, 0, 0, 0, 1],
 ['h', 'anom:ore', 'ore', 'Ore', 1, 1, 0, 0, 1],
 ['', 'QWE-503', '', 'Ordinary Perimeter Deposit', 100, '9h 15m', '']];
var h = '<tr><th></th><th>Sig</th><th>Type</th><th>Name / leads to</th><th class="num">Scan</th><th class="num">Age</th><th></th></tr>';
R.forEach(function (r) {
  if (r[0] === 'h') {
    var cnt = r[4] + (r[6] ? ' · <span class="d">' + r[6] + ' −</span>' : '') + (r[7] ? ' · <span class="n">' + r[7] + ' +</span>' : '');
    h += '<tr class="gh' + (r[1] === 'sig:data' ? ' is-hover' : '') + '"><td colspan="7"><span class="car">' + (r[5] ? '▾' : '▸') + '</span><span class="lm-grp ' + r[2] + ' ttl">' + (r[8] ? '<small>Anomalies ·</small> ' : '') + r[3] + '</span><span class="cnt">' + cnt + '</span></td></tr>';
    return;
  }
  h += '<tr class="' + (r[7] || '') + '"><td class="flag">' + r[0] + '</td><td class="sig">' + r[1] + '</td><td class="lm-mono">' + r[2] + '</td><td class="nm">' + r[3] + '</td>' +
    '<td class="num"><span class="lm-scan' + (r[4] == 100 ? ' full' : '') + '"><i><b style="width:' + r[4] + '%"></b></i>' + r[4] + '%</span></td><td class="num">' + r[5] + '</td>' +
    '<td>' + (r[6] ? '<button class="lm-btn sm" title="Copy bookmark name">⧉ ' + r[6] + '</button>' : '') + '</td></tr>';
});
document.getElementById('t').innerHTML = h;
</script>
</body>
</html>
