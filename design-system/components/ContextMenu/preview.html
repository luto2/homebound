<!-- @dsCard group="Navigation" height=400 width=1520 subtitle="Right-click menus: system node, connection, map background, character row, route destination" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><style>
.row { display: flex; gap: 24px; align-items: flex-start; }
.st { display: flex; flex-direction: column; gap: 8px; position: relative; }
.lm-menu.ctx { width: 292px; } .lm-menu .it .ck, .lm-menu .it .ic { flex: none; } .lm-menu.ctx.narrow { width: 230px; } .lm-menu .it { white-space: nowrap; }
.lm-menu .it .ic.ok { color: var(--success); font-weight: 800; } .lm-menu .it.is-hover .ic.ok { color: var(--ink-inverse); }
.col { display: flex; flex-direction: column; gap: 16px; }
</style></head>
<body>
<div class="row" id="r"></div>
<script>
/* item: [check, label, meta, cls, ic]  · '-' = separator · ['#', caption] = section */
function menu(items, w) {
  return '<div class="lm-menu ctx' + (w ? ' ' + w : '') + '">' + items.map(function (i) {
    if (i === '-') return '<div class="sep"></div>';
    if (i[0] === '#') return '<div class="sec">' + i[1] + '</div>';
    return '<div class="it ' + (i[3] || '') + '"><span class="' + (i[4] ? 'ic ' + i[4] : 'ck') + '">' + (i[0] || '') + '</span><span>' + i[1] + '</span>' + (i[2] ? '<span class="meta">' + i[2] + '</span>' : '') + '</div>';
  }).join('') + '</div>';
}
function st(cap, html, extra) { return '<div class="st"><span class="lm-caption">' + cap + '</span>' + html + (extra || '') + '</div>'; }
var r = '';
var CONFIRM = ['✓', 'Mark as confirmed', '', '', 'ok'];
r += st('System node · B2 (unconfirmed)', menu([CONFIRM.slice(0, 3).concat(['is-hover', 'ok']), '-', ['', 'Rename …', 'F2'], ['', 'Draw connection from here', 'Shift+drag'], ['', 'Set as home'], ['', 'Change static / hole …'], '-',
  ['', 'Mark as scanned now'], ['', 'Request zKill now'], ['', 'Add as route destination'], '-', ['✕', 'Remove from map', 'Del', '', 'danger']]));
r += st('Connection · A2 ↔ B2 (unconfirmed)', menu([CONFIRM, ['', 'Edit connection …', 'Enter'], '-', ['#', 'Mass'], ['●', 'Fresh'], ['', 'Reduced · R'], ['', 'Critical · CRIT', '', 'is-hover'], '-',
  ['#', 'Lifetime'], ['', 'Stable'], ['●', '◷ < 4h'], ['', '◷ < 1h'], ['', '✕ Expired'], '-', ['✕', 'Collapse', '', '', 'danger']]));
r += st('System node · Home', menu([['', 'Rename …', 'F2'], ['', 'Draw connection from here', 'Shift+drag'], ['', 'Set as home', '', 'is-disabled'], ['', 'Change static / hole …', '', 'is-disabled'], '-',
  ['', 'Mark as scanned now'], ['', 'Request zKill now'], ['', 'Add as route destination'], '-', ['✕', 'Remove from map', 'Del', 'is-disabled', 'danger']]),
  '<div class="lm-tip" style="left:96px;top:262px">Home can’t be removed. Set another home first.</div>' +
  '<span class="lm-help" style="margin-top:34px;width:292px">Other disabled reasons, shown as tooltips: Set as home “This is already home.” · Change static / hole “Home has no parent hole.” or “Not connected to a parent system.”</span>');
r += '<div class="col">' + st('Map background', menu([['', 'Add system …', 'Ins'], ['', 'Fit chain', 'F']], 'narrow')) +
  st('Character row · Ryn Vass', menu([['', 'Pin overlay to this character'], ['', 'Show on map', 'Space']], 'narrow')) + '</div>';
r += st('Route destination · 1DQ1-A', menu([['', 'Copy route', 'Double-click', 'is-disabled'], ['', 'Move up'], ['', 'Move down', '', 'is-disabled'], '-', ['✕', 'Remove destination', '', '', 'danger']], 'narrow'),
  '<div class="lm-tip" style="left:170px;top:44px">There is no known route.</div>');
document.getElementById('r').innerHTML = r;
</script>
</body>
</html>
