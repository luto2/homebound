<!-- @dsCard group="Map" height=560 width=760 -->
<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>

<div style="position:relative;height:540px;background:var(--bg-0)" id="m"></div>
<script>
var LM = window.Homebound;
var m = document.getElementById('m'), h = '';
function cap(x, y, t) { return '<div class="lm-caption" style="position:absolute;left:' + x + 'px;top:' + y + 'px">' + t + '</div>'; }
function at(x, y, o) { o.x = x; o.y = y; return LM.node(o); }
/* states */
h += cap(16, 8, 'Default') + at(16, 36, {name:'A2',j:'J163856',cls:'C5',fx:'redgiant',statics:['C5'],owner:['LZRD',1],zk:'med'});
h += cap(204, 8, 'Selected · 2 chars') + at(204, 36, {name:'A2a',j:'J120617',cls:'C5',statics:['C5'],chars:[1,3],zk:'none',state:'is-selected'});
h += cap(392, 8, 'Hover · recent kill') + at(392, 36, {name:'C',j:'J222911',cls:'C6',fx:'magnetar',statics:['C6'],zk:'high',recent:true,state:'is-hover'});
h += cap(580, 8, 'Home') + at(580, 36, {name:'Home',j:'J161940',cls:'C2',statics:['C3','HS'],owner:['HOME',6,true],chars:[2],state:'is-home'});
h += cap(16, 124, 'K-space') + at(16, 152, {name:'8',sub:'Jita',j:'Sirseshin',cls:'HS',sec:'0.6',zk:'low'});
h += cap(392, 124, 'Zoom 55% · compact') + '<div class="lm-node compact" style="position:absolute;left:392px;top:152px;width:120px"><div class="l1"><span class="nm">A2a</span><span class="end">' + LM.cls('C5') + '</span></div></div>';
h += cap(580, 124, 'Zoom 30% · minimal') + '<div class="lm-node minimal" style="position:absolute;left:580px;top:152px"><div class="l1"><span class="nm" style="font-size:13px">A2a</span></div></div>';
/* top-edge tabs */
h += '<div style="position:absolute;left:16px;right:16px;top:238px;border-top:1px solid var(--line-1)"></div>';
h += cap(16, 250, 'Unconfirmed') + at(16, 280, {name:'B2',j:'J140217',cls:'C3',statics:['LS'],unconfirmed:true,scan:'never',zk:'none'});
h += cap(204, 250, 'Rescan due · hatch') + at(204, 280, {name:'B1',j:'J140217',cls:'C1',fx:'blackhole',statics:['HS'],scan:'26h',state:'is-stale'});
h += cap(392, 250, 'Never pasted') + at(392, 280, {name:'A3',j:'J005299',cls:'C4',fx:'cataclysmic',statics:['C1','C3'],scan:'never',zk:'low'});
h += cap(580, 250, 'Rescan due · 2 chars') + at(580, 280, {name:'A1',j:'J105443',cls:'C3',statics:['NS'],scan:'3d',chars:[1,4],zk:'none',state:'is-stale'});
h += cap(16, 368, 'Home + unconfirmed: SCAN') + at(16, 398, {name:'Home',j:'J161940',cls:'C2',statics:['C3','HS'],owner:['HOME',6,true],unconfirmed:true,scan:'26h',state:'is-home is-stale'});
h += cap(204, 368, '… + a character: no SCAN') + at(204, 398, {name:'Home',j:'J161940',cls:'C2',statics:['C3','HS'],owner:['HOME',6,true],unconfirmed:true,scan:'26h',chars:[2],state:'is-home is-stale'});
h += cap(392, 368, '4 characters') + at(392, 398, {name:'C',j:'J222911',cls:'C6',fx:'magnetar',statics:['C6'],chars:[1,2,3,4],zk:'high'});
h += cap(580, 368, 'Selected · tabs') + at(580, 398, {name:'B2',j:'J140217',cls:'C3',statics:['LS'],unconfirmed:true,chars:[5],zk:'none',state:'is-selected'});
h += '<div class="lm-help" style="position:absolute;left:16px;top:484px;right:16px">Line 1: custom name · zKill. Line 2: class · effect · J-name · statics. Line 3: owner (omitted if none). ' +
     'Top edge, left to right: ▲ UNCONFIRMED (warning) · rescan tab SCAN 26h / NO SCAN (stale grey) · character markers (2 + “+n” when more than 3 don’t fit) · ⌂ HOME (accent) at the right end.</div>';
m.innerHTML = h;
</script>
</body>
</html>
