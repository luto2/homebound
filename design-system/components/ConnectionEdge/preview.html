<!-- @dsCard group="Map" height=358 width=760 -->
<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>

<div style="position:relative;height:328px;background:var(--bg-0)"><svg id="s" width="760" height="328" style="position:absolute;inset:0"></svg><div id="l"></div></div>
<script>
var LM = window.Homebound;
var rows = [
 ['Fresh', {type:'B274', mass:'fresh'}], ['Reduced <50%', {type:'O477', mass:'reduced'}], ['Critical <10%', {type:'K162', mass:'critical'}],
 ['Lifetime < 4h', {type:'H296', mass:'fresh', eol:1}], ['Lifetime < 1h', {type:'N062', mass:'reduced', eol:2}], ['Critical + < 4h', {type:'V753', mass:'critical', eol:1}], ['Expired', {type:'D382', mass:'fresh', eol:3}], ['Frigate-only', {type:'E004', mass:'fresh', frig:true}], ['Unknown', {type:'K162', mass:'unknown'}]];
var svg = '', lab = '';
rows.forEach(function(r, i){ var y = 22 + i * 34;
  svg += LM.edgeSvg(180, y, 600, y, r[1]);
  lab += '<div style="position:absolute;left:16px;top:' + (y - 9) + 'px;font-size:12px">' + r[0] + '</div><div style="position:absolute;left:390px;top:' + (y - 8) + 'px;transform:translateX(-50%)">' + LM.elabel(r[1]) + '</div>'; });
document.getElementById('s').innerHTML = svg; document.getElementById('l').innerHTML = lab;
</script>
</body>
</html>
