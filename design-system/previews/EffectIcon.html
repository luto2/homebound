<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/bundle.js"></script><meta charset="utf-8"></head>
<body>

<div class="lm-col"><div class="lm-row" id="a" style="gap:16px"></div><div class="lm-row" id="b" style="gap:16px"></div></div>
<script>
var LM = window.Homebound;
var ks = ['pulsar','blackhole','cataclysmic','magnetar','redgiant','wolfrayet','none'];
document.getElementById('a').innerHTML = ks.map(function(k){return '<span class="lm-fxchip">' + LM.fx(k, 16) + LM.FXNAME[k] + '</span>'}).join('');
document.getElementById('b').innerHTML = ks.map(function(k){return LM.fx(k, 12)}).join('') + '<span class="lm-help">12px — smallest size; shapes stay distinct</span>';
</script>
</body>
</html>
