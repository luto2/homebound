<!-- @dsCard group="Map" height=290 width=760 -->
<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/bundle.js"></script><meta charset="utf-8"></head>
<body>

<div style="position:relative;height:260px;background:var(--bg-0)"><svg id="s" width="760" height="260" style="position:absolute;inset:0"></svg><div id="l"></div></div>
<script>
var LM = window.Homebound;
var rows = [
 ['Fresh', {type:'B274', mass:'fresh'}], ['Reduced <50%', {type:'O477', mass:'reduced'}], ['Critical <10%', {type:'K162', mass:'critical'}],
 ['EOL (+ fresh)', {type:'H296', mass:'fresh', eol:true}], ['Critical + EOL', {type:'V753', mass:'critical', eol:true}], ['Frigate-only', {type:'E004', mass:'fresh', frig:true}], ['Unknown', {type:'K162', mass:'unknown'}]];
var svg = '', lab = '';
rows.forEach(function(r, i){ var y = 22 + i * 34;
  svg += LM.edgeSvg(180, y, 600, y, r[1]);
  lab += '<div style="position:absolute;left:16px;top:' + (y - 9) + 'px;font-size:12px">' + r[0] + '</div><div style="position:absolute;left:390px;top:' + (y - 8) + 'px;transform:translateX(-50%)">' + LM.elabel(r[1]) + '</div>'; });
document.getElementById('s').innerHTML = svg; document.getElementById('l').innerHTML = lab;
</script>
</body>
</html>
