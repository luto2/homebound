[project]
name = "homebound"
version = "0.1.0"
description = "Offline EVE Online wormhole mapper with a client overlay"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
