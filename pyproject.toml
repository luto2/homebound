[project]
name = "homebound"
version = "1.0.0"
description = "Offline EVE Online wormhole mapper with a client overlay"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.8",   # QtCore/Gui/Widgets/Svg/DBus; the Addons modules aren't used
    "httpx>=0.27",
    "websockets>=13",
]

[project.scripts]
homebound = "homebound.__main__:main"
homebound-server = "homebound_server.__main__:main"

[project.optional-dependencies]
server = [
    "cryptography>=42",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "homebound[server]"]
packaging = ["pyinstaller>=6.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebound", "homebound_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
