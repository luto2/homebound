[project]
name = "homebound"
version = "0.1.0"
description = "Offline EVE Online wormhole mapper with a client overlay"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.8",   # QtCore/Gui/Widgets/Svg/DBus; the Addons modules aren't used
    "httpx>=0.27",
]

[project.scripts]
homebound = "homebound.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7"]
packaging = ["pyinstaller>=6.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
