[project]
name = "homebound"
version = "1.0.1"
description = "Offline EVE Online wormhole mapper with a client overlay"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.8",   # QtCore/Gui/Widgets/Svg/DBus; the Addons modules aren't used
    "certifi",                   # imported directly: the CA bundle every TLS connection trusts
    "httpx>=0.27",
    "websockets>=13",
]

[project.scripts]
homebound = "homebound.__main__:main"
homebound-server = "homebound_server.__main__:main"

[project.optional-dependencies]
server = [
    "cryptography>=42",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "homebound[server]",
    "mypy>=2.4.1",
]
packaging = ["pyinstaller>=6.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebound", "homebound_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.12"
files = ["homebound", "homebound_server"]
ignore_missing_imports = true
warn_unused_ignores = false

# PySide6's stubs reject things Qt accepts: keyword signals (QTimer(timeout=...)), float margins, delegate
# overrides with QModelIndex narrower than the stub, Optional returns for widgets that exist after setup.
# Silence those classes of error in the Qt-facing packages only; the data layer stays fully checked.
[[tool.mypy.overrides]]
module = ["homebound.ui.*", "homebound.theme.*", "homebound.platform.*", "homebound.__main__"]
disable_error_code = ["override", "call-overload", "call-arg", "union-attr", "attr-defined", "func-returns-value", "method-assign", "misc"]
