name: test

on:
  push:
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen
  UV_PYTHON_PREFERENCE: only-system

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"            # the oldest version pyproject.toml allows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Week number (static data cache key)
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: static-sources-${{ steps.week.outputs.week }}
      - run: uv sync --python ${{ matrix.python }}
      - name: Build static data (the tests use the real universe)
        run: uv run python -m homebound.universe.build_static
      - run: uv run pytest -q
      - name: Doc check (dead links, missing header blocks)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python3 tools/check_docs.py --strict
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run mypy
